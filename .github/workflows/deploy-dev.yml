name: Deploy dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-terraform
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy dev
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure credentials
        run: az account show

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          login_server="$(az acr show --name "${{ vars.ACR_NAME }}" --query loginServer --output tsv)"
          image="${login_server}/${{ vars.CONTAINER_IMAGE_NAME }}:${IMAGE_TAG}"
          docker build --tag "$image" .
          docker push "$image"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Initialize Terraform
        run: >-
          terraform -chdir=infra init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Deploy the image to dev
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: >-
          terraform -chdir=infra apply -auto-approve -input=false
          -var="project_name=${{ vars.TF_PROJECT_NAME }}"
          -var="location=${{ vars.AZURE_LOCATION }}"
          -var="acr_name=${{ vars.ACR_NAME }}"
          -var="container_image_tag=${IMAGE_TAG}"
          -target='azurerm_container_app.application["dev"]'
